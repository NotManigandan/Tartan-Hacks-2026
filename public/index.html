<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share Translator</title>
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="grey lighten-4">

    <nav class="blue darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo center">Screen Translator</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 20px;">
        <div class="row center-align">
            <div class="col s12 m4">
                <div class="input-field">
                    <select id="targetLang">
                        <option value="es" selected>Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese (Simplified)</option>
                        <option value="ja">Japanese</option>
                        <option value="hi">Hindi</option>
                    </select>
                    <label>Target Language</label>
                </div>
            </div>
            <div class="col s12 m4">
                <button id="startShareBtn" class="btn-large waves-effect waves-light blue">
                    <i class="material-icons left">screen_share</i>Share Screen
                </button>
                <button id="stopShareBtn" class="btn-large waves-effect waves-light red" disabled>
                    <i class="material-icons left">stop_screen_share</i>Stop
                </button>
            </div>
            <div class="col s12 m4">
                <div class="switch" style="margin-top: 1rem;">
                    <label>
                        Overlay Off
                        <input type="checkbox" id="overlayToggle" checked>
                        <span class="lever"></span>
                        Overlay On
                    </label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <div class="video-container-wrapper card z-depth-3">
                    <div id="videoContainer" class="video-container-custom">
                        <div class="canvas-wrapper">
                            <video id="screenVideo" autoplay playsinline muted></video>
                            <canvas id="overlayCanvas"></canvas>
                        </div>
                    </div>
                    <div class="card-content">
                        <p class="center-align grey-text">Share your screen to start translating text in real-time.</p>
                        <div class="progress blue lighten-4 hide" id="progressBar">
                            <div class="indeterminate blue"></div>
                        </div>
                        <p id="statusId" class="center-align caption"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
